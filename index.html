<!doctype html>

<html>
	<head>
		<title>
			Starlink
		</title>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer" />	
		<style>
		
			body
			{
				margin:0px;
				padding:0px;
				font-family:Arial, sans-serif;
				color:white;
			}
			
			.background_image1,.background_image2,.background_image3,.background_image4;
			{

			}
			
			.background_image1
			{
				background-image:url("https://starlink.com/assets-new/images/landing/field/v4_night_sky.webp");
				height:140vh;			
				width:100%;								
				background-repeat:no-repeat;
				background-size:cover;
				background-position:50% 50%;				
			}
			nav
			{
				padding-top:45px;
				padding-left:30px;			
			}
			.first
			{
				display:inline-block;
				vertical-align:top;					
			}
			.second
			{
				display:inline-block;
				vertical-align:top;	
				float:right;
			}
			.nav
			{
				text-decoration:none;
				color:white;
				margin-right:30px;
				text-align:center;				
				font-size:14px;			
			}
			.strlink
			{
				margin-right:40px;				
			}
			.button_area
			{
				display:inline-block;
				vertical-align:top;	
				height:30px;
				width:170px;
				background-color:#4B515B;
				border-radius:7px;
				text-align:center;
				margin-right:30px;
				
			}
			.button_top
			{
				color:white;
				text-decoration:none;				
				font-size:14px;
			}
			.personal
			{
				display:inline-block;
				vertical-align:top;					
				height:21px;
				width:80px;
				background-color:#777C87;
				border-radius:7px;
				text-align:center;
				margin-left:-17px;
				padding-top:5%;
				margin-right:10px;
			}
			.business
			{				
				display:inline-block;
				vertical-align:top;					
				padding-top:5px;
				
			}
			.menu_options
			{
				display:inline-block;
				vertical-align:top;					
				height:28px;
				width:35px;
				border-radius:100%;
				background-color:#3F444F;
				
				font-size:20px;
				text-align:center;
				padding-top:6px;
				margin-right:20px;				
			}
			.menu_options a{
				color:#A6A8AD;
				text-decoration:none;
			}
			.discp1
			{
				height:330px;
				width:45%;			
				margin-left:60px;
				margin-top:145px;				
			}
			.heading1
			{
				color:white;
				font-size:57px;
			}
			.heading2,.heading3,.mo
			{
				color:#93979C;				
			}
			.mo
			{
				font-size:24px;			
			}
			.button_get
			{
				color:black;
				background-color:white;
				width:130px;
				height:35px;
				border-radius:5px;
				border:none;
				margin-right:15px;
			}			
			.button_price
			{
				color:white;
				background-color:#2E323A;
				width:130px;
				height:35px;
				border-radius:5px;
				border:none;
			}
			.btns
			{				
				margin-top:0px;
				margin-left:60px;		
			}
			
			.black_background
			{
				height:140vh;
				width:100%;
				background-color:black;
			}
			.background_image2
			{
				background-image:url("https://starlink.com/assets-new/images/landing/field/v4_lightning.webp");
				height:140vh;			
				width:100%;								
				background-repeat:no-repeat;
				background-size:cover;
				background-position:50% 50%;				
			}
			.discp2
			{
				height:330px;
				width:45%;			
				margin-left:60px;				
				background-color:red;				
			}
			.background_image3
			{
				background-image:url("https://starlink.com/assets-new/images/landing/field/v4_car_on_ice.webp");
				height:140vh;			
				width:100%;								
				background-repeat:no-repeat;
				background-size:cover;
				background-position:50% 50%;				
			}	
			
			.background_image4
			{
				background-image:url("https://starlink.com/assets-new/images/landing/field/v4_residential_yard.webp");				
				height:140vh;			
				width:100%;								
				background-repeat:no-repeat;
				background-size:cover;
				background-position:50% 50%;				
			}			
			.background_image5
			{
				background-image:url("https://starlink.com/assets-new/images/landing/field/v4_germany_alps_roof.webp");				
				height:140vh;			
				width:100%;								
				background-repeat:no-repeat;
				background-size:cover;
				background-position:50% 50%;				
			}
			
		</style>
	
	</head>
	
	<body>		
		<section class="background_image1">
			<nav>
				<div class="first">
					<a href="#starlink" class="nav strlink"><img height="20" width="120" src="https://starlink.com/assets/images/logo/logo_white.png"></a>
					<a href="#residential" class="nav">Residential</a>
					<a href="#roam" class="nav">Roam</a>
				</div>
				<div class="second">
					<div class="button_area">
						<a href="#Personal" class="button_top">
							<div class="personal">
								Personal
							</div>
						</a>
						<div class="business">
							<a href="#Business" class="button_top">
								Business
							</a>
						</div>					
					</div>
					<div class="menu_options">
						<a href="#menu">
							<i class="ri-menu-line"></i>
						</a>
					</div>						
				</div>
			</nav>
			
			<section>
				<div class="discp1">
					<h1 class="heading1">
						Fast, affordable <br> internet
					</h1>
					<span class="heading2">
						No upfront hardware cost in select areas.						
					</span>
					<h5 class="heading3">
						STARTING FROM
					</h5>
					<div class="heading1">
						<b>£40</b><span class="mo">/mo</span>
					</div>
				</div>
				<div class="btns">					
					<button class="button_get">
						Get started
					</button>					
					<button class="button_price">
						View pricing
					</button>
				</div>
			</section>
		</section>	
		
		<section class="black_background">
					<div class="button_area">
						<a href="#Personal" class="button_top">
							<div class="personal">
								At home
							</div>
						</a>
						<div class="business">
							<a href="#Business" class="button_top">
								On the go
							</a>
						</div>					
					</div>		
		
		</section>
		
		<section class="background_image2">
			<div class="discp2">
				
			</div>
		</section>	
		
		<section class="background_image3">
			<span>
				 Abuzar 
			</span>		
		</section>	
		
		<section class="background_image4">
			<span>
				 Abuzar 
			</span>		
		</section>		
		<section class="background_image5">
			<span>
				 Abuzar 
			</span>		
		</section>

</html>
